name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        ruby-version: ["3.3", "3.4"]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run unit specs
        env:
          RUBYOPT: "-E UTF-8:UTF-8"
        run: bundle exec rspec --exclude-pattern "spec/integration/**/*_spec.rb" --format progress

  integration:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run integration specs
        env:
          RUBYOPT: "-E UTF-8:UTF-8"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bundle exec rspec spec/integration --tag integration --format progress
